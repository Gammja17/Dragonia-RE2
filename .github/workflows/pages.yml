# docs/ 를 GitHub Pages 로 올린다.
# 예전 방식(legacy Jekyll 빌더)이 새 저장소에서 계속 실패해서 Actions 로 옮겼다.
# Unity WebGL 빌드를 docs/game/ 에 넣어 커밋하면 그대로 같이 올라간다.
name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
